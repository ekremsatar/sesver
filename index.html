<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SesVer — Metinden Sese Seslendirme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161B;
    --panel:#1B2129;
    --panel-2:#20272F;
    --cream:#EFEAE0;
    --cream-dim:#A9A79E;
    --amber:#E8A33D;
    --teal:#3E7068;
    --teal-bright:#5FA79B;
    --rec:#C1443C;
    --line:#2C333C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 50% -10%, #1a2129 0%, var(--ink) 60%);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}

  /* NAV */
  nav{
    border-bottom:1px solid var(--line);
    padding:18px 0;
  }
  .nav-inner{display:flex;justify-content:space-between;align-items:center;}
  .logo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:19px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;
  }
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
  .nav-links{display:flex;gap:26px;font-size:14px;color:var(--cream-dim);}
  .nav-links a{text-decoration:none;transition:color .15s;}
  .nav-links a:hover{color:var(--cream);}

  /* HERO */
  .hero{padding:64px 0 40px;text-align:center;}
  .eyebrow{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--amber);margin:0 0 14px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(32px,5.5vw,52px);margin:0 0 16px;letter-spacing:-0.015em;line-height:1.05;
  }
  .sub{
    max-width:560px;margin:0 auto;color:var(--cream-dim);
    font-size:16px;line-height:1.6;
  }

  /* AD SLOT */
  .ad-slot{
    border:1px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    color:#6b7280;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:28px 0;
  }

  /* STUDIO */
  .studio{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px;}
  @media (max-width:760px){.studio{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .panel-title{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--cream-dim);margin:0 0 14px;display:flex;justify-content:space-between;
  }

  textarea{
    width:100%;min-height:220px;resize:vertical;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--cream);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;
    padding:16px;outline:none;
  }
  textarea:focus{border-color:var(--teal-bright);}
  textarea::placeholder{color:#6b7280;}

  .meta-row{
    display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    font-family:'Space Mono',monospace;font-size:12px;color:var(--cream-dim);
  }
  .samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .sample-btn{
    background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:all .15s;
  }
  .sample-btn:hover{border-color:var(--amber);color:var(--amber);}

  /* mode toggle */
  .mode-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .mode-btn{
    flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--cream-dim);font-size:13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;position:relative;
  }
  .mode-btn.active{border-color:var(--amber);color:var(--cream);background:#26201a;}
  .mode-btn .tag{
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-bright);
  }
  .mode-btn.locked .tag{color:var(--rec);}
  .mode-btn.locked{cursor:not-allowed;opacity:.75;}

  select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--cream);
    font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;border-radius:8px;outline:none;
  }
  select:disabled{opacity:.4;}

  .fader-group{display:flex;justify-content:space-between;gap:14px;margin-top:20px;}
  .fader{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
  .fader-label{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim);}
  .fader-value{font-family:'Space Mono',monospace;font-size:12px;color:var(--amber);}
  .fader-track{
    position:relative;height:120px;width:36px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding:4px 0;
  }
  input[type=range].vfader{-webkit-appearance:none;appearance:none;width:104px;height:104px;background:transparent;transform:rotate(-90deg);margin:0;}
  input[type=range].vfader::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:4px;}
  input[type=range].vfader::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:14px;margin-top:-5px;border-radius:3px;
    background:var(--teal-bright);border:1px solid #0c0f13;cursor:pointer;
  }
  input[type=range].vfader::-moz-range-track{height:4px;background:var(--line);border-radius:4px;}
  input[type=range].vfader::-moz-range-thumb{width:26px;height:14px;border-radius:3px;background:var(--teal-bright);border:1px solid #0c0f13;cursor:pointer;}

  .note{margin-top:16px;font-size:12.5px;color:var(--cream-dim);line-height:1.6;}

  /* transport */
  .transport{
    margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .waveform{flex:1;min-width:140px;height:48px;display:flex;align-items:center;gap:3px;}
  .bar{width:4px;border-radius:2px;background:var(--teal);height:6px;transition:background .2s;}
  .bar.active{background:var(--amber);}
  .btn{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--cream);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--amber);}
  .btn.primary{width:54px;height:54px;background:var(--amber);border-color:var(--amber);color:#181410;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--line);}
  .status{font-family:'Space Mono',monospace;font-size:11px;color:var(--cream-dim);letter-spacing:.05em;}
  .onair{display:flex;align-items:center;gap:8px;}
  .lamp{width:9px;height:9px;border-radius:50%;background:#3a3f46;transition:all .2s;}
  .lamp.on{background:var(--rec);box-shadow:0 0 10px 2px rgba(193,68,60,.65);}

  footer{
    margin-top:60px;border-top:1px solid var(--line);padding:26px 0 40px;
    text-align:center;color:#6b7280;font-size:12.5px;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <div class="logo"><span class="dot"></span>SesVer</div>
    <div class="nav-links">
      <a href="#studio">Araç</a>
      <a href="#hakkinda">Hakkında</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Metinden Sese</p>
    <h1>Yazdığınız Her Şeyi<br>Sese Dönüştürün</h1>
    <p class="sub">Türkçe metinlerinizi saniyeler içinde doğal seslendirmeye çevirin. Ücretsiz başlayın, isterseniz premium seslerle kaliteyi bir üst seviyeye taşıyın.</p>
  </div>

  <div class="ad-slot">Reklam Alanı — 728×90</div>

  <div id="studio">
    <div class="studio">
      <div class="panel">
        <p class="panel-title">Senaryo</p>
        <textarea id="scriptText" placeholder="Seslendirilecek metni buraya yazın..."></textarea>
        <div class="meta-row">
          <span id="charCount">0 karakter</span>
          <span id="wordCount">0 kelime</span>
        </div>
        <div class="samples">
          <button class="sample-btn" data-sample="Merhaba, bugün nasılsınız? Bu bir örnek seslendirme metnidir.">Örnek: Selamlama</button>
