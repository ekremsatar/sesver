<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SesVer - Metinden Sese Dönüştürücü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0F19; color: #FFFFFF; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header -->
    <div class="w-full max-w-2xl flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white font-bold p-2 rounded-lg">SV</div>
            <span class="text-xl font-bold">SesVer</span>
        </div>
        <span class="bg-gray-800 text-xs px-2 py-1 rounded text-gray-400">v1.2</span>
    </div>

    <!-- Main Form -->
    <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
        <div class="text-center mb-6">
            <span class="text-xs font-semibold text-amber-500 uppercase tracking-widest">METİNDEN SESE</span>
            <h1 class="text-2xl md:text-3xl font-bold mt-1">Yazdığınız Her Şeyi Sese Dönüştürün</h1>
            <p class="text-gray-400 text-sm mt-2">Türkçe metinlerinizi saniyeler içinde doğal seslendirmeye çevirin.</p>
        </div>

        <!-- Ses Seçim Alanı (%100 Çalışan Ücretsiz Ses ID'leri) -->
        <div class="mb-4">
            <label for="voiceSelect" class="block text-xs text-gray-400 mb-2">SES TONU / KARAKTER SEÇİN</label>
            <select id="voiceSelect" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                <option value="JBFqnCBsd6RMkjVDRZzb">Erkek 1 (George - Olgun & Derin)</option>
                <option value="N2lLq5mBkI2p52723O45">Erkek 2 (Callum - Tok & Doğal)</option>
                <option value="EXAVITQu4vr4xnSDxMaL">Kadın 1 (Bella - Net & Açık)</option>
                <option value="cgSgspJ2msm6clMCkdW9">Kadın 2 (Jessica - Yumuşak & Akıcı)</option>
            </select>
        </div>

        <!-- Metin Giriş Alanı -->
        <div class="mb-4">
            <div class="flex justify-between text-xs text-gray-400 mb-2">
                <span>SENARYO / METİN</span>
                <span id="charCount">0 / 500</span>
            </div>
            <textarea id="textInput" rows="4" maxlength="500" placeholder="Seslendirmek istediğiniz metni buraya yazın..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-4 text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
        </div>

        <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200">
            Sesi Oluştur
        </button>

        <!-- Ses Oynatıcı ve İndirme Butonu -->
        <div id="audioContainer" class="mt-4 hidden space-y-3">
            <audio id="audioPlayer" controls class="w-full"></audio>
            <a id="downloadBtn" href="#" download="sesver-ses.mp3" class="w-full flex justify-center items-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition duration-200 text-sm">
                ⬇️ Sesi Cihaza İndir (.mp3)
            </a>
        </div>

        <!-- Hata Kutusu -->
        <div id="errorBox" class="mt-4 p-4 bg-red-950/50 border border-red-800 rounded-xl text-red-400 text-xs hidden break-all"></div>
    </div>

    <!-- Footer -->
    <div class="text-gray-600 text-xs py-4">
        © 2026 SesVer. Tüm Hakları Saklıdır.
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const charCount = document.getElementById('charCount');
        const generateBtn = document.getElementById('generateBtn');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorBox = document.getElementById('errorBox');

        let currentBlobUrl = null;

        textInput.addEventListener('input', () => {
            charCount.textContent = `${textInput.value.length} / 500`;
        });

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const voiceId = voiceSelect.value;
            
            errorBox.classList.add('hidden');
            audioContainer.classList.add('hidden');

            if (!text) {
                errorBox.textContent = 'Lütfen seslendirilecek bir metin girin.';
                errorBox.classList.remove('hidden');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = 'Ses Oluşturuluyor...';

            try {
                const response = await fetch('/api/generate-speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voiceId })
                });

                const contentType = response.headers.get('content-type');

                // Dönen yanıt ses dosyası değilse (JSON hata mesajı geldiyse)
                if (!response.ok || !contentType || !contentType.includes('audio/mpeg')) {
                    const errData = await response.json().catch(() => ({ error: 'Bilinmeyen bir sunucu hatası oluştu.' }));
                    throw new Error(errData.error || `Hata Kodu: ${response.status}`);
                }

                // Eski URL'i bellekten temizle
                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }

                const blob = await response.blob();
                currentBlobUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = currentBlobUrl;
                downloadBtn.href = currentBlobUrl;
                
                audioContainer.classList.remove('hidden');
                audioPlayer.play().catch(e => console.log('Otomatik oynatma engellendi:', e));

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Sesi Oluştur';
            }
        });
    </script>
</body>
</html>
