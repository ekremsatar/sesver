<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SesVer - Metinden Sese</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 p-6 rounded-xl shadow-lg w-full max-w-md border border-gray-800">
        <h1 class="text-2xl font-bold mb-1">SesVer</h1>
        <span class="text-xs text-gray-500 mb-6 block">v1.2</span>

        <div class="mb-4">
            <label class="block text-gray-400 text-sm mb-2">SES TONU / KARAKTER SEÇİN</label>
            <select id="voiceSelect" class="w-full bg-gray-800 text-white p-3 rounded-lg border border-gray-700 focus:outline-none">
                <option value="EXAVITQu4vr4xnSDxMaL">Bella (Kadın)</option>
                <option value="pNInz6obpgDQGcFmaJgB">Adam (Erkek)</option>
                <option value="ErXwobaYiN019PkySvjV">Antoni (Erkek)</option>
                <option value="VR6AewlNigW4w4MNVPH2">Arnold (Erkek)</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-gray-400 text-sm mb-2">SENARYO / METİN</label>
            <textarea id="textInput" maxlength="500" class="w-full bg-gray-950 text-white p-4 rounded-lg border border-gray-700 h-32 focus:outline-none" placeholder="Buraya yazın..."></textarea>
            <div id="charCount" class="text-right text-gray-500 text-xs mt-1">0 / 500</div>
        </div>

        <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">Sesi Oluştur</button>

        <div id="errorMsg" class="mt-4 p-3 bg-red-900/30 border border-red-800 text-red-500 text-sm rounded-lg hidden"></div>
        <div id="resultArea" class="mt-4 hidden">
            <audio id="audioPlayer" controls class="w-full mb-3"></audio>
            <a id="downloadLink" class="block text-center text-blue-400 hover:text-blue-300 underline text-sm">Sesi İndir</a>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const generateBtn = document.getElementById('generateBtn');
        const voiceSelect = document.getElementById('voiceSelect');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const errorMsg = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');

        textInput.addEventListener('input', () => {
            charCount.innerText = `${textInput.value.length} / 500`;
        });

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value;
            const voiceId = voiceSelect.value;

            if (!text) {
                alert('Lütfen bir metin girin.');
                return;
            }

            generateBtn.innerText = 'Oluşturuluyor...';
            generateBtn.disabled = true;
            errorMsg.classList.add('hidden');
            resultArea.classList.add('hidden');

            try {
                const response = await fetch('/api/generate-speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voiceId })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Ses oluşturulamadı (Muhtemelen ID geçersiz).');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                audioPlayer.src = url;
                downloadLink.href = url;
                resultArea.classList.remove('hidden');
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                generateBtn.innerText = 'Sesi Oluştur';
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
