<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Etiketleri -->
  <title>SesVer - Ücretsiz Metinden Sese Dönüştürücü (TTS)</title>
  <meta name="description" content="Türkçe metinlerinizi saniyeler içinde yapay zeka destekli doğal seslendirmeye çevirin. Ücretsiz ve hızlı metinden sese dönüştürme aracı.">
  <meta name="keywords" content="metinden sese, tts, seslendirme, yapay zeka ses, türkçe seslendirme, elevenlabs">
  <meta name="robots" content="index, follow">
  
  <!-- Google Search Console Doğrulama (Kendi doğrulama kodunu content alanına yapıştır) -->
  <meta name="google-site-verification" content="SEARCH_CONSOLE_DOGRULAMA_KODUNUZ" />

  <!-- Google Analytics (GA4) (G-XXXXXXXXXX kısmını kendi Kimliğinle değiştir) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Google AdSense (ca-pub-XXXXXXXXXXXXXXXX kısmını kendi Yayıncı Kimliğinle değiştir) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 16px; }
    .container { max-width: 650px; width: 100%; text-align: center; }
    .badge { color: #d97706; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p.subtitle { color: #9ca3af; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    
    /* AdSense Reklam Alanları */
    .ad-container { margin: 20px 0; width: 100%; text-align: center; overflow: hidden; min-height: 90px; }
    
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    .card-label { font-size: 10px; color: #6b7280; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; display: block; }
    textarea { width: 100%; height: 160px; background-color: #1a2234; border: 1px solid #2d3748; border-radius: 8px; color: #f3f4f6; padding: 14px; font-size: 14px; resize: vertical; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #3b82f6; }
    .info-row { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin: 8px 0 16px 0; }
    .btn { width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
    .btn:hover { background-color: #1d4ed8; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background-color: #374151; cursor: not-allowed; opacity: 0.7; }
    audio { width: 100%; margin-top: 16px; display: none; }
    .status { margin-top: 12px; font-size: 13px; text-align: center; font-weight: 500; }
    footer { margin-top: auto; padding: 20px 0 10px; color: #4b5563; font-size: 12px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="badge">Metinden Sese</div>
  <h1>Yazdığınız Her Şeyi Sese Dönüştürün</h1>
  <p class="subtitle">Türkçe metinlerinizi saniyeler içinde doğal seslendirmeye çevirin. Ücretsiz başlayın, isterseniz premium seslerle kaliteyi bir üst seviyeye taşıyın.</p>

  <!-- Üst AdSense Banner -->
  <div class="ad-container">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="card">
    <span class="card-label">SENARYO</span>
    <textarea id="textInput" placeholder="Seslendirilecek metni buraya yazın..."></textarea>
    
    <div class="info-row">
      <span id="charCount">0 karakter</span>
      <span id="wordCount">0 kelime</span>
    </div>

    <button id="generateBtn" class="btn">Sesi Oluştur</button>
    <div id="status" class="status"></div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <!-- Alt AdSense Banner -->
  <div class="ad-container">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="0987654321"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
</div>

<footer>
  <p>&copy; 2026 SesVer. Tüm Hakları Saklıdır.</p>
</footer>

<script>
  const textInput = document.getElementById('textInput');
  const charCount = document.getElementById('charCount');
  const wordCount = document.getElementById('wordCount');
  const generateBtn = document.getElementById('generateBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const status = document.getElementById('status');

  textInput.addEventListener('input', () => {
    const text = textInput.value;
    charCount.textContent = `${text.length} karakter`;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordCount.textContent = `${words} kelime`;
  });

  generateBtn.addEventListener('click', async () => {
    const text = textInput.value.trim();
    if (!text) {
      status.style.color = '#ef4444';
      status.textContent = 'Lütfen seslendirilecek bir metin girin.';
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = 'Ses Oluşturuluyor...';
    status.style.color = '#9ca3af';
    status.textContent = '';
    audioPlayer.style.display = 'none';

    try {
      const response = await fetch('/api/generate-speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!response.ok) throw new Error('Ses oluşturulamadı.');

      const blob = await response.blob();
      const audioUrl = URL.createObjectURL(blob);
      
      audioPlayer.src = audioUrl;
      audioPlayer.style.display = 'block';
      audioPlayer.play();
      status.style.color = '#10b981';
      status.textContent = 'Ses başarıyla hazırlandı!';
    } catch (err) {
      status.style.color = '#ef4444';
      status.textContent = 'Bir hata oluştu. Lütfen tekrar deneyin.';
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Sesi Oluştur';
    }
  });
</script>

</body>
</html>
